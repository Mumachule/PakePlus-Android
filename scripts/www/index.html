<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>植物大战僵尸 · 黑夜草坪（手机版）</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; height: 100dvh;
    background: #0d1117;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  canvas {
    max-width: 100vw; max-height: 100vh; max-height: 100dvh;
    width: auto; height: auto;
    border-radius: 12px; box-shadow: 0 20px 60px #000c;
    cursor: pointer;
    object-fit: contain;
    display: block;
    touch-action: none;
  }
  #rotateHint {
    position: fixed; inset: 0; z-index: 30;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0d1117f2; color: #e8dcc0;
    font-size: 20px; text-align: center; padding: 24px;
    touch-action: none;
  }
  #rotateHint .phone {
    width: 54px; height: 90px; border: 3px solid #e8dcc0; border-radius: 10px;
    animation: tilt 1.8s ease-in-out infinite;
  }
  @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotateHint { display: flex; }
  }
  #fsBtn {
    position: fixed; left: calc(10px + env(safe-area-inset-left));
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 20; width: 48px; height: 40px; border-radius: 10px;
    border: 1px solid #5a4a72; background: #241d30cc; color: #e8dcc0;
    font-size: 14px; line-height: 1; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #fsBtn:active { background: #4a3a62; }
</style>
</head>
<body>
<canvas id="cv" width="1600" height="932"></canvas>
<div id="rotateHint"><div class="phone"></div><div>请横屏游玩</div><div style="font-size:14px;color:#9a90a8">横屏后画面更大、更好操作</div></div>
<button id="fsBtn" aria-label="全屏">全屏</button>
<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

const W = cv.width, H = cv.height;
const TOP = 160; 
const BOTTOM_BAR = 52; 
const COLS = 9, ROWS = 5;

const GRASS_X = 112;
const GRASS_W = W - GRASS_X * 2; 
const CW = GRASS_W / COLS;       
const CH = Math.floor((H - TOP - BOTTOM_BAR) / ROWS); 

const CARD_Y = 13, CARD_H = 130, CARD_X0 = 240; 
const CARD_W = 150; 
const SHOVEL_X = 125, SHOVEL_Y = 13, SHOVEL_W = 104, SHOVEL_H = 130;

/* ===== 植物阵容 ===== */
const PLANT_ORDER = ['puffshroom','sunshroom','fumeshroom','gravebuster',
                     'hypnoshroom','scaredyshroom','iceshroom','doomershroom','gloamshroom'];

const PLANT_DEFS = {
  puffshroom:   {name:'小喷菇',    cost:0,   cd:4,   hp:300 },
  sunshroom:    {name:'阳光菇',    cost:25,  cd:7.5, hp:300 },
  fumeshroom:   {name:'大喷菇',    cost:75,  cd:7.5, hp:300 },
  gravebuster:  {name:'墓碑吞噬者',cost:50,  cd:7.5, hp:300 },
  hypnoshroom:  {name:'魅惑菇',    cost:75,  cd:30,  hp:300 },
  scaredyshroom:{name:'胆小菇',    cost:25,  cd:7.5, hp:300 },
  iceshroom:    {name:'寒冰菇',    cost:75,  cd:50,  hp:300 },
  doomershroom: {name:'毁灭菇',    cost:175, cd:50,  hp:300 },
  gloamshroom:  {name:'忧郁菇',    cost:300, cd:50,  hp:300, upgradeFrom:'fumeshroom' },
};

/* ===== 僵尸点数与解锁规则 ===== */
const ZOMBIE_COSTS = {
  normal: 1, cone: 2, pole: 3, bucket: 4, 
  newspaper: 5, dancer: 5, screendoor: 4, 
  football: 7, gargantuar: 10
};

const UNLOCK_WAVES = {
  normal: 1, cone: 3, bucket: 6, 
  newspaper: 8, pole: 12, screendoor: 10, 
  dancer: 16, football: 18, gargantuar: 20
};

let seenZombieTypes = new Set();

/* ================= 音频引擎 ================= */
let audioCtx = null;
let bgmTimer = null;
let bgmNoteIndex = 0;
let lastShootSoundTime = 0; 
let lastFumeSoundTime = 0; // 大喷菇音效节流

const bgmNotes = [
  220.00, 261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 261.63,
  196.00, 246.94, 293.66, 349.23, 392.00, 349.23, 293.66, 246.94,
  220.00, 329.63, 440.00, 523.25, 440.00, 329.63, 261.63, 220.00
];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startBGM();
  }
}
function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playSound(type) {
  if (!audioCtx) return;
  if (type === 'sun') {
    playTone(880, 'sine', 0.12, 0.10);
    setTimeout(() => playTone(1318, 'sine', 0.2, 0.09), 60);
  } else if (type === 'shoot') {
    const now = audioCtx.currentTime;
    if (now - lastShootSoundTime < 0.05) return;
    lastShootSoundTime = now;
    playTone(260, 'sine', 0.06, 0.03);
  } else if (type === 'plant') {
    playTone(200, 'sine', 0.18, 0.06);
    playTone(100, 'sine', 0.25, 0.05);
  } else if (type === 'hit') {
    playTone(100, 'sine', 0.05, 0.04);
  } else if (type === 'smash') {
    playTone(70, 'sawtooth', 0.35, 0.14);
    playTone(55, 'sine', 0.5, 0.10);
  } else if (type === 'eat') {
    playTone(150 + Math.random()*40, 'sine', 0.05, 0.03);
  } else if (type === 'spore') {
    const now = audioCtx.currentTime;
    if (now - lastFumeSoundTime < 0.15) return; // 节流 150ms
    lastFumeSoundTime = now;
    playTone(520, 'sine', 0.10, 0.045);
    playTone(780, 'sine', 0.08, 0.03);
  } else if (type === 'ice') {
    playTone(1200, 'sine', 0.4, 0.08);
    setTimeout(() => playTone(900, 'sine', 0.5, 0.06), 100);
    setTimeout(() => playTone(1600, 'sine', 0.6, 0.05), 220);
  } else if (type === 'boom') {
    playTone(60, 'sawtooth', 0.7, 0.20);
    playTone(45, 'sine', 0.9, 0.16);
    playTone(120, 'square', 0.35, 0.10);
  }
}
function startBGM() {
  if (bgmTimer) clearInterval(bgmTimer);
  bgmTimer = setInterval(() => {
    if (gameState !== 'playing' || !audioCtx) return;
    const freq = bgmNotes[bgmNoteIndex % bgmNotes.length];
    playTone(freq, 'sine', 0.85, 0.055);
    if (bgmNoteIndex % 4 === 0) playTone(freq / 2, 'sine', 1.8, 0.065);
    if (bgmNoteIndex % 8 === 4) playTone(freq * 2, 'triangle', 0.5, 0.028);
    bgmNoteIndex++;
  }, 560);
}

/* ================= 核心数据 ================= */
let plants, zombies, bullets, suns, particles, graves, craters;
let sun, selected, cardCD, gameState, gameTime;
let killed;
let wave, waveTimer, spawnQueue, spawnCooldown, waveText, waveTextTimer, lastWaveTotalHp;
let screenShake = 0;
let endTimer = 0;
let iceDelayPending = false;
let waveDelay = 0;
const mouse = {x:-1, y:-1};

/* ================= 历史战绩（本地存档） ================= */
const RECORDS_KEY = 'pvz_night_records_v1';
const RECORD_BTN = { x: 1462, y: 887, w: 122, h: 34 };
let runHistory = [];
let showHistory = false;
let mobilePaused = false;
let runSaved = false;

function loadRunHistory(){
  try {
    const raw = localStorage.getItem(RECORDS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    runHistory = Array.isArray(arr)
      ? arr.filter(r => r && typeof r === 'object').slice(0, 50)
      : [];
  } catch (e) {
    runHistory = [];
  }
}

function persistRunHistory(){
  try {
    localStorage.setItem(RECORDS_KEY, JSON.stringify(runHistory.slice(0, 50)));
  } catch (e) { /* 无痕模式 / file:// 限制时仅保留本次会话记录 */ }
}

function saveRunRecord(result){
  if (runSaved) return;
  runSaved = true;
  const rec = {
    result: result === 'win' ? 'win' : 'lose',
    time: Math.max(0, Math.round(gameTime)),
    kills: Math.max(0, killed | 0),
    wave: Math.max(0, wave | 0),
    date: Date.now(),
  };
  runHistory.unshift(rec);
  if (runHistory.length > 50) runHistory.length = 50;
  persistRunHistory();
}

function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + '分' + (s < 10 ? '0' : '') + s + '秒';
}

function fmtRecordDate(ts){
  const d = new Date(ts);
  const p = n => (n < 10 ? '0' : '') + n;
  return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function getHistoryBest(){
  let bestTime = null, bestKills = 0, bestWave = 0;
  for (const r of runHistory){
    if (r.result === 'win' && (bestTime === null || r.time < bestTime)) bestTime = r.time;
    if (r.kills > bestKills) bestKills = r.kills;
    if (r.wave > bestWave) bestWave = r.wave;
  }
  return { bestTime, bestKills, bestWave };
}

function inRecordButton(x, y){
  return x >= RECORD_BTN.x && x <= RECORD_BTN.x + RECORD_BTN.w &&
         y >= RECORD_BTN.y && y <= RECORD_BTN.y + RECORD_BTN.h;
}

loadRunHistory();

function isPortraitPhone(){
  return window.innerHeight > window.innerWidth && window.innerWidth < 900;
}
function syncMobilePause(){
  mobilePaused = isPortraitPhone();
}
window.addEventListener('resize', syncMobilePause);
window.addEventListener('orientationchange', () => setTimeout(syncMobilePause, 200));
syncMobilePause();

function reset(){
  plants = []; zombies = []; bullets = []; suns = []; particles = [];
  graves = []; craters = [];
  sun = 150;
  selected = null;
  cardCD = {};
  PLANT_ORDER.forEach(k => cardCD[k] = 0);
  gameState = 'playing';
  gameTime = 0;
  killed = 0;
  screenShake = 0;
  endTimer = 0;
  runSaved = false;
  showHistory = false;
  iceDelayPending = false;
  waveDelay = 0;
  seenZombieTypes = new Set(['normal']);

  wave = 0;
  waveTimer = 0; 
  spawnQueue = [];
  spawnCooldown = 0;
  waveText = "";
  waveTextTimer = 0;
  lastWaveTotalHp = 0;
  
  initGraves();
  bgmNoteIndex = 0;
}

function initGraves(){
  graves = [];
  const used = new Set();
  let tries = 0;
  while (graves.length < 4 && tries < 400){
    tries++;
    const col = 3 + Math.floor(Math.random() * (COLS - 3)); // 避开前三列
    const row = Math.floor(Math.random() * ROWS);
    const k = col + ',' + row;
    if (used.has(k)) continue;
    used.add(k);
    graves.push({ col, row, shake: 0 });
  }
}

/* 墓碑生成：只在完全空的格子生成，满了就顶掉植物 */
function addGraveRandom(){
  const used = new Set(graves.map(g => g.col + ',' + g.row));
  const plantCells = new Set(plants.map(p => p.col + ',' + p.row));
  const emptyCandidates = [];
  const occupiedCandidates = [];

  for (let col = 3; col < COLS; col++){ // 避开前三列
    for (let row = 0; row < ROWS; row++){
      const k = col + ',' + row;
      if (used.has(k)) continue;
      if (plantCells.has(k)) occupiedCandidates.push({col, row});
      else emptyCandidates.push({col, row});
    }
  }

  let pick = null;
  if (emptyCandidates.length > 0) {
    pick = emptyCandidates[Math.floor(Math.random() * emptyCandidates.length)];
  } else if (occupiedCandidates.length > 0) {
    // 植物满了，强行顶掉
    pick = occupiedCandidates[Math.floor(Math.random() * occupiedCandidates.length)];
    for (let i = plants.length - 1; i >= 0; i--){
      if (plants[i].col === pick.col && plants[i].row === pick.row) {
        const c = cellCenter(pick.col, pick.row);
        addParticles(c.x, c.y, '#6a5a7a', 16);
        plants.splice(i, 1);
      }
    }
  }
  
  if (!pick) return;
  graves.push({ col: pick.col, row: pick.row, shake: 0 });
  const c = cellCenter(pick.col, pick.row);
  addParticles(c.x, c.y + 20, '#3a2e30', 12, { sizeMul: 1.1 });
}

function getWaveConfig(w){
  if (w === 50) return { count: 12, big: true, text: "最后一波！" };
  if (w === 48) return { count: 12, big: true, text: "一大波僵尸正在接近！" };
  if (w === 40) return { count: 10, big: true, text: "一大波僵尸正在接近！" };
  if (w === 30) return { count: 9, big: true, text: "一大波僵尸正在接近！" };
  if (w === 20) return { count: 8, big: true, text: "一大波僵尸正在接近！" };
  if (w === 10) return { count: 7, big: true, text: "一大波僵尸正在接近！" };
  if (w < 10) return { count: Math.min(3, 1 + Math.floor(w / 4)), big: false };
  if (w < 20) return { count: 2 + Math.floor((w - 10) / 3), big: false };
  if (w < 30) return { count: 3 + Math.floor((w - 20) / 3), big: false };
  if (w < 40) return { count: 4 + Math.floor((w - 30) / 3), big: false };
  return { count: 5 + Math.floor((w - 40) / 4), big: false };
}

function getWaveMinTime(w){
  // 动态最短波长：第 1 波 6 秒，随波数线性缩短，第 50 波降到 2 秒
  const t = 6 - (Math.min(50, Math.max(1, w)) - 1) * (4 / 49);
  return Math.round(Math.max(2, Math.min(6, t)) * 100) / 100;
}

function getWaveMaxTime(w){
  // 最长波长：第 1 波 35 秒，随波数线性缩短，第 50 波降到 10 秒
  const t = 35 - (Math.min(50, Math.max(1, w)) - 1) * (25 / 49);
  return Math.round(Math.max(10, Math.min(35, t)) * 100) / 100;
}

function getMultiplier(w) {
  if (w < 10) return 1;
  if (w === 10) return 2;
  if (w < 20) return 3;
  if (w === 20) return 4;
  if (w < 30) return 5;
  if (w === 30) return 6;
  if (w < 40) return 7;
  if (w === 40) return 8;
  if (w < 48) return 9;
  return 10; 
}

function getWaveBudget(w) {
  let base = 0;
  if (w <= 5) {
    base = w * 1.4; // 1~5波：1,2,3,5,7
  } else if (w <= 20) {
    base = 8 + (w - 5) * 2;
  } else if (w <= 40) {
    base = 38 + (w - 20) * 4;
  } else {
    base = 118 + (w - 40) * 6;
  }
  const conf = getWaveConfig(w);
  if (conf.big) base *= 1.6; 
  return Math.floor(base);
}

function startWave(w){
  wave = w;
  const conf = getWaveConfig(w);
  
  if (conf.text) { waveText = conf.text; waveTextTimer = 3.5; }
  else waveTextTimer = 0;

  if (w >= 1) {
    const num = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < num; i++) addGraveRandom();
  }

  /* ===== 点数预算生成机制 ===== */
  let list = [];
  let budget = getWaveBudget(w);
  
  const pool = Object.keys(UNLOCK_WAVES).filter(type => w >= UNLOCK_WAVES[type]);
  let w_normal = (w >= 20) ? 5 : 10;
  let w_cone = (w >= 40) ? 3 : 6;
  const weights = { 
    normal: w_normal, cone: w_cone, pole: 4, bucket: 3, 
    newspaper: 2, dancer: 1, screendoor: 2, football: 1, gargantuar: 1 
  };
  
  while (budget > 0) {
    const affordable = pool.filter(type => ZOMBIE_COSTS[type] <= budget);
    if (affordable.length === 0) break;
    
    let totalW = 0;
    for (const t of affordable) totalW += weights[t];
    let r = Math.random() * totalW;
    let selectedType = affordable[0];
    for (const t of affordable) {
      r -= weights[t];
      if (r <= 0) { selectedType = t; break; }
    }
    
    list.push(selectedType);
    seenZombieTypes.add(selectedType);
    budget -= ZOMBIE_COSTS[selectedType];
  }
  
  if (conf.big) {
    list.push({type: 'flag', hp: Math.max(170, 1000 * getMultiplier(w))});
  }
  
  list.sort(() => Math.random() - 0.5);
  
  spawnQueue = list;
  spawnCooldown = 1.5; 
  waveTimer = 0;

  // ====== 计算本波僵尸的真实总血量 ======
  let totalHp = 0;
  list.forEach(item => {
    let t = typeof item === 'object' ? 'flag' : item;
    let hp = 200;
    if (t === 'cone') hp = 560;
    else if (t === 'bucket') hp = 1370;
    else if (t === 'newspaper') hp = 1440;
    else if (t === 'screendoor') hp = 1300;
    else if (t === 'football') hp = 3220;
    else if (t === 'gargantuar') hp = 7200;
    else if (t === 'pole') hp = 500;
    else if (t === 'dancer') hp = 720;
    
    // 普、路、铁、门 一次出三只，血量要乘3
    if (['normal', 'cone', 'bucket', 'screendoor'].includes(t)) hp *= 3;
    totalHp += hp;
  });
  lastWaveTotalHp = totalHp;
  // ====================================

  if (conf.big && graves.length > 0) triggerGraveSpawn();
}

function triggerGraveSpawn(){
  const pool = Array.from(seenZombieTypes).filter(t => t !== 'backup' && t !== 'imp' && t !== 'dancer' && t !== 'flag');
  if (pool.length === 0) pool.push('normal');
  graves.forEach(g => {
    const type = pool[Math.floor(Math.random() * pool.length)];
    const c = cellCenter(g.col, g.row);
    spawnZombieFromGrave(type, g.row, c.x);
  });
}

/* ================= 工具 ================= */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function cellCenter(col, row){
  return {x: GRASS_X + col * CW + CW / 2, y: TOP + row * CH + CH / 2};
}
function addParticles(x, y, color, n, opts = {}){
  const { glow = false, sizeMul = 1, speedMul = 1 } = opts;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = (50 + Math.random() * 180) * speedMul;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 80,
      life: 0.5 + Math.random() * 0.3,
      max: 0.8, color,
      r: (3 + Math.random() * 4) * sizeMul,
      glow,
    });
  }
}
function mushroomCap(cx, cy, rx, ry, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
}

/* ================= 阳光 ================= */
function spawnSunAt(p, value){
  const c = cellCenter(p.col, p.row);
  suns.push({
    x: c.x + (Math.random() - 0.5) * 50,
    y: c.y - 15,
    targetY: c.y + 20,
    rest: 0, age: 0,
    value: value || 25,
  });
}
function drawSun(s){
  const val = s.value || 25;
  let scale = 1;
  if (val <= 10) scale = 0.62;
  else if (val >= 50) scale = 1.35;
  const pulse = 1 + Math.sin(gameTime * 4 + s.x) * 0.06;
  const r = 25 * scale * pulse;
  const alpha = s.rest > 11 ? 0.4 + 0.6 * Math.abs(Math.sin(gameTime * 8)) : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = '#ffb84d';
  ctx.shadowBlur = 26 * scale;
  ctx.fillStyle = '#ffb347';
  for (let i = 0; i < 8; i++){
    const a = i / 8 * Math.PI * 2 + gameTime * 0.6;
    ctx.beginPath();
    ctx.ellipse(s.x + Math.cos(a) * r * 0.95, s.y + Math.sin(a) * r * 0.95, 9 * scale, 5 * scale, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#ff9a1f';
  ctx.beginPath(); ctx.arc(s.x, s.y, r * 0.88, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd08a';
  ctx.beginPath(); ctx.arc(s.x - r * 0.2, s.y - r * 0.2, r * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ================= 植物绘制 ================= */
function drawPlantShape(type, cx, cy, s = 1, grown = true, stage = 2){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.lineCap = 'round';

  if (type === 'puffshroom'){
    ctx.fillStyle = '#e2d8ea';
    roundRect(-8, -6, 16, 26, 7); ctx.fill();
    mushroomCap(0, -6, 26, 22, '#9b7ec8');
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(-11, -17, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -19, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, -10, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b1b3a';
    ctx.beginPath(); ctx.arc(-7, 4, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 4, 3.2, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'sunshroom'){
    let capC, glowA, spotC, stemC, eyeC, capRx, capRy;
    if (stage === 0) { capC = '#a8862c'; glowA = 0.12; spotC = 'rgba(255,255,255,.25)'; stemC = '#c8bca0'; eyeC = '#4a3010'; capRx = 22; capRy = 18; }
    else if (stage === 1) { capC = '#e8b83a'; glowA = 0.35; spotC = 'rgba(255,255,255,.5)'; stemC = '#e0d4b8'; eyeC = '#6a4010'; capRx = 28; capRy = 23; }
    else { capC = '#ffc93a'; glowA = 0.6; spotC = 'rgba(255,255,255,.7)'; stemC = '#f0e4c4'; eyeC = '#7a4a10'; capRx = 33; capRy = 27; }

    ctx.fillStyle = stemC;
    roundRect(-9, -6, 18, 26, 7); ctx.fill();
    const g = ctx.createRadialGradient(0, -14, 4, 0, -14, 44);
    g.addColorStop(0, `rgba(255,215,90,${glowA})`);
    g.addColorStop(1, 'rgba(255,215,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -14, 44, 0, Math.PI*2); ctx.fill();
    mushroomCap(0, -6, capRx, capRy, capC);
    ctx.fillStyle = spotC;
    ctx.beginPath(); ctx.arc(-12, -18, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -20, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, -10, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = eyeC;
    ctx.beginPath(); ctx.arc(-7, 3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 3, 3, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'fumeshroom'){
    ctx.fillStyle = '#d8cfae';
    roundRect(-11, -6, 22, 28, 7); ctx.fill();
    mushroomCap(0, -6, 32, 24, '#9b59b6');
    ctx.fillStyle = '#7d3c98';
    ctx.beginPath(); ctx.ellipse(27, -8, 9, 13, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a2a6a';
    ctx.beginPath(); ctx.ellipse(30, -8, 5, 8, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    ctx.beginPath(); ctx.arc(-13, -20, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(220,180,255,.6)';
    ctx.beginPath(); ctx.arc(6, -18, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, -12, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b1a3a';
    ctx.beginPath(); ctx.arc(-7, 3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, 3, 3, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'gravebuster'){
    const grad = ctx.createLinearGradient(-24, -36, 24, 20);
    grad.addColorStop(0, '#9a9aa8');
    grad.addColorStop(1, '#6a6a78');
    ctx.fillStyle = grad;
    roundRect(-22, -34, 44, 52, 5); ctx.fill();
    ctx.strokeStyle = '#4a4a58';
    ctx.lineWidth = 3;
    roundRect(-22, -34, 44, 52, 5); ctx.stroke();
    ctx.fillStyle = '#b0b0bc';
    roundRect(-26, -42, 52, 11, 3); ctx.fill();
    ctx.strokeStyle = '#4a4a58';
    ctx.lineWidth = 2.5;
    roundRect(-26, -42, 52, 11, 3); ctx.stroke();
    ctx.fillStyle = '#3a3a48';
    ctx.font = 'bold 13px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('R.I.P', 0, -10);
    ctx.strokeStyle = 'rgba(40,40,52,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-8, 6); ctx.lineTo(-14, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(8, 5); ctx.lineTo(16, 11); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(0, 18, 28, 6, 0, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'hypnoshroom'){
    ctx.fillStyle = '#efe0f0';
    roundRect(-8, -6, 16, 26, 7); ctx.fill();
    mushroomCap(0, -6, 27, 22, '#c15fbf');
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let a = 0; a < Math.PI*2.6; a += 0.18){
      const r = 2 + a * 1.6;
      const x = Math.cos(a) * r;
      const y = -10 + Math.sin(a) * r * 0.55;
      if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#3a1b3a';
    ctx.beginPath(); ctx.arc(-7, 4, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 4, 3, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'scaredyshroom'){
    ctx.fillStyle = '#ddd2bc';
    roundRect(-7, -6, 14, 26, 6); ctx.fill();
    mushroomCap(0, -8, 24, 20, '#a08a5a');
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    ctx.beginPath(); ctx.arc(-8, -16, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b2010';
    ctx.beginPath(); ctx.arc(-7, 2, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 2, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2b2010'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 11, 5, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  }

  else if (type === 'iceshroom'){
    const g = ctx.createRadialGradient(0, -8, 10, 0, -8, 44);
    g.addColorStop(0, 'rgba(160,220,255,.22)');
    g.addColorStop(1, 'rgba(160,220,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -8, 44, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d8eef8';
    roundRect(-9, -6, 18, 26, 8); ctx.fill();
    mushroomCap(0, -6, 28, 23, '#7cc8ea');
    ctx.fillStyle = '#e8f8ff';
    ctx.strokeStyle = '#a0d8f0'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++){
      const a = -Math.PI/2 + (i - 2) * 0.46;
      const bx = Math.cos(a) * 20;
      const by = -6 + Math.sin(a) * 16;
      const tx = Math.cos(a) * 34;
      const ty = -6 + Math.sin(a) * 30;
      ctx.beginPath();
      ctx.moveTo(bx - 4, by + 2); ctx.lineTo(tx, ty); ctx.lineTo(bx + 4, by + 2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#1a3a4a';
    ctx.beginPath(); ctx.arc(-7, 4, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 4, 3.2, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'doomershroom'){
    const g = ctx.createRadialGradient(0, -8, 8, 0, -8, 48);
    g.addColorStop(0, 'rgba(255,70,70,.22)');
    g.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -8, 48, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2a48';
    roundRect(-11, -6, 22, 28, 8); ctx.fill();
    mushroomCap(0, -6, 33, 26, '#4a3060');
    ctx.fillStyle = '#2a1a3a';
    for (let i = 0; i < 7; i++){
      const a = Math.PI + 0.15 + i * (Math.PI - 0.3) / 6;
      const bx = Math.cos(a) * 28;
      const by = -6 + Math.sin(a) * 23;
      const tx = Math.cos(a) * 44;
      const ty = -6 + Math.sin(a) * 37;
      ctx.beginPath();
      ctx.moveTo(bx - 4, by); ctx.lineTo(tx, ty); ctx.lineTo(bx + 4, by);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#221230'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-20, -22); ctx.lineTo(-12, -14); ctx.lineTo(-18, -6);
    ctx.moveTo(16, -20); ctx.lineTo(10, -10); ctx.lineTo(18, -2);
    ctx.stroke();
    ctx.save();
    ctx.shadowColor = '#ff3030'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff4040';
    ctx.beginPath(); ctx.arc(-10, 2, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 2, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#1a0a24';
    ctx.beginPath(); ctx.ellipse(0, 13, 7, 4, 0, 0, Math.PI*2); ctx.fill();
  }

  else if (type === 'gloamshroom'){
    ctx.fillStyle = '#7a5a8a';
    roundRect(-11, -6, 22, 28, 8); ctx.fill();
    mushroomCap(0, -6, 32, 26, '#8a5ab8');
    ctx.fillStyle = 'rgba(200,150,255,.55)';
    ctx.beginPath(); ctx.arc(-12, -16, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -18, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(20, -8, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor = '#ff5e5e'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff5e5e';
    ctx.beginPath(); ctx.arc(-9, 2, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, 2, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a103a';
    ctx.beginPath(); ctx.ellipse(0, 12, 6, 3.5, 0, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawPlant(p){
  const c = cellCenter(p.col, p.row);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(c.x, c.y + 46, 34, 11, 0, 0, Math.PI * 2); ctx.fill();

  if (p.stunTimer > 0) {
    const t = gameTime;
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * Math.PI * 2 / 3;
      const sx = c.x + Math.cos(a) * 25;
      const sy = c.y - 25 + Math.sin(a) * 10;
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      for (let j = 0; j < 5; j++) {
        const ang = j * Math.PI * 2 / 5 - Math.PI / 2;
        const x = sx + Math.cos(ang) * 6;
        const y = sy + Math.sin(ang) * 6;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill();
    }
  }

  if (selected === 'gloamshroom' && p.type === 'fumeshroom') {
    ctx.save();
    ctx.shadowColor = '#c080ff'; ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(180, 130, 230, 0.42)';
    ctx.beginPath(); ctx.arc(c.x, c.y + 10, 48, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (p.type === 'iceshroom' && p.t < 1){
    ctx.strokeStyle = `rgba(140,220,255,${0.75 - p.t*0.5})`;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(c.x, c.y, 30 + p.t * 60, 0, Math.PI*2); ctx.stroke();
  }
  if (p.type === 'doomershroom' && p.t < 1.2){
    const k = p.t / 1.2;
    ctx.strokeStyle = `rgba(255,90,90,${0.9 - k*0.5})`;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(c.x, c.y, 30 + k * 80, 0, Math.PI*2); ctx.stroke();
  }
  if (p.type === 'gloamshroom'){
    for (let i = 0; i < 5; i++){
      const a = gameTime * 2.5 + i * (Math.PI * 2 / 5);
      const r = 32 + Math.sin(gameTime * 3 + i * 1.7) * 6;
      const sx = c.x + Math.cos(a) * r;
      const sy = c.y + 6 + Math.sin(a) * r * 0.45;
      ctx.save();
      ctx.shadowColor = '#c080ff'; ctx.shadowBlur = 18;
      ctx.globalAlpha = 0.4 + 0.3 * Math.sin(gameTime * 4 + i);
      ctx.fillStyle = '#b884e8';
      ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  if (p.type === 'scaredyshroom' && p.hiding){
    drawPlantShape(p.type, c.x, c.y + 22, 1.05);
    return;
  }

  if (p.type === 'puffshroom'){
    const sameCell = plants.filter(pl => pl.col === p.col && pl.row === p.row && pl.type === 'puffshroom');
    const idx = sameCell.indexOf(p);
    const total = sameCell.length;
    const offX = (idx - (total - 1) / 2) * 18;
    const offY = idx * -8;
    drawPlantShape(p.type, c.x + offX, c.y + 10 + offY, 1.3);
    return;
  }

  if (p.type === 'sunshroom'){
    const stage = p.stage || 0;
    const scale = stage === 0 ? 0.95 : (stage === 1 ? 1.28 : 1.73);
    drawPlantShape(p.type, c.x, c.y + 10, scale, true, stage);
  } else {
    drawPlantShape(p.type, c.x, c.y + 10, 1.3, true, 2);
  }
}

/* ================= 僵尸绘制 ================= */
function drawZombie(z){
  let baseY = TOP + z.row * CH + CH / 2 + 60;
  const t = gameTime;
  const isFrozen = z.freezeTimer > 0;
  const walk = (z.eating || isFrozen || z.dancerState === 'summoning' || z.dancerState === 'sliding') ? 0 : Math.sin(t * 7 + z.walkPhase) * 7;
  const chew = z.eating ? Math.sin(t * 14) * 3 : 0;
  const slowed = z.slow > 0;

  let bodyC  = slowed ? '#6d8fa0' : '#5d6b4d';
  let clothC = slowed ? '#577a8a' : '#46543a';
  let armC   = slowed ? '#9fc4d4' : '#8fa67a';
  let headC  = slowed ? '#a8c8d8' : '#a3b88c';
  if (isFrozen) { bodyC = '#a0e0ff'; clothC = '#80c0e0'; armC = '#c0f0ff'; headC = '#d0f8ff'; }

  let jumpY = 0;
  if (z.jumping) {
    const p = 1 - (z.jumpTimer / 2.0);
    jumpY = -Math.sin(p * Math.PI) * 80; 
  }

  ctx.save();
  const scaleMul = z.friendly ? 1.2 : 1;

  if (z.isFlying) {
    ctx.translate(z.x, baseY + z.yOffset); ctx.rotate(z.flyAngle); ctx.scale(0.9, 0.9);
    if (z.friendly) ctx.scale(-1, 1);
  } else if (z.type === 'gargantuar') {
    ctx.translate(z.x, baseY + (z.emergeOffset || 0)); ctx.scale(2.2 * scaleMul, 2.2 * scaleMul);
    if (z.friendly) ctx.scale(-1, 1);
  } else if (z.type === 'imp') {
    ctx.translate(z.x, baseY + jumpY + (z.emergeOffset || 0)); ctx.scale(0.9 * scaleMul, 0.9 * scaleMul);
    if (z.friendly) ctx.scale(-1, 1);
  } else {
    ctx.translate(z.x, baseY + jumpY + (z.emergeOffset || 0)); ctx.scale(1.45 * scaleMul, 1.45 * scaleMul);
    if (z.friendly) ctx.scale(-1, 1);
  }

  if (z.friendly) {
    ctx.save();
    ctx.shadowColor = '#d070ff'; ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(200,110,255,.28)';
    ctx.beginPath(); ctx.arc(0, -60, 55, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  if (z.type === 'pole' && z.hasPole && !z.jumping) ctx.rotate(-0.1); 

  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0, 2, 28, 10, 0, 0, Math.PI * 2); ctx.fill();

  if (z.type === 'flag'){
    ctx.save();
    ctx.translate(14, -56);
    ctx.strokeStyle = '#a07446'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -70); ctx.stroke();
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.moveTo(0, -70); ctx.quadraticCurveTo(30, -58, 36, -40); ctx.quadraticCurveTo(18, -40, 0, -30);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(14, -50, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (z.type === 'gargantuar') {
    let gBodyC = slowed ? '#8db4cc' : '#a67c8c';
    let gClothC = slowed ? '#4a6b7a' : '#6b4c3a';
    let gPantsC = slowed ? '#406080' : '#5c3a21';
    let gPoleC = slowed ? '#5b82a0' : '#7a5230';
    if (isFrozen) { gBodyC = '#b0e0ff'; gClothC = '#9fd0f0'; gPantsC = '#80c0e0'; gPoleC = '#8fe3ff'; }
    ctx.fillStyle = gPantsC;
    ctx.fillRect(-16 + walk * 0.6, -30, 14, 30);
    ctx.fillRect(2 - walk * 0.6, -30, 14, 30);
    ctx.fillStyle = gBodyC; 
    roundRect(-26, -85, 52, 55, 15); ctx.fill();
    ctx.fillStyle = gClothC;
    roundRect(-28, -60, 56, 30, 8); ctx.fill();
    ctx.fillStyle = slowed ? '#2a4050' : '#2a1e16';
    ctx.fillRect(-10, -58, 6, 8);
    ctx.fillRect(4, -55, 4, 10);
    ctx.fillStyle = gBodyC;
    ctx.beginPath(); ctx.arc(0, -105, 24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(-8, -108, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -108, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7, -109, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -109, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2a2a';
    ctx.beginPath(); ctx.ellipse(-4, -92, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(-15, -60);
    let angle = -0.15;
    if (z.eating) {
      if (z.smashTimer < 0.6) angle = -0.15 - (z.smashTimer / 0.6) * 1.35;
      else if (z.smashTimer < 0.75) angle = -1.5 + ((z.smashTimer - 0.6) / 0.15) * 1.5;
      else angle = 0;
    }
    ctx.rotate(angle);
    ctx.fillStyle = gPoleC;
    ctx.fillRect(-6, -110, 12, 130);
    ctx.fillStyle = slowed ? '#3a5b70' : '#5c3a21';
    ctx.fillRect(-25, -100, 50, 10);
    ctx.fillRect(-20, -75, 40, 10);
    ctx.restore();
  }
  else if (z.type === 'imp') {
    const bdC = slowed ? '#8fa9bf' : '#c0392b';
    ctx.fillStyle = '#4a5a3a';
    ctx.fillRect(-10 + walk * 0.6, -20, 8, 20);
    ctx.fillRect(2 - walk * 0.6, -20, 8, 20);
    ctx.fillStyle = bdC;
    roundRect(-15, -50, 30, 32, 8); ctx.fill();
    ctx.fillStyle = slowed ? '#4a6b7a' : '#4a2e12';
    ctx.fillRect(-15, -32, 30, 6);
    ctx.fillStyle = slowed ? '#a0c0d8' : '#9db88c';
    ctx.beginPath(); ctx.arc(0, -60, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.arc(-6, -62, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -62, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2a2a';
    ctx.beginPath(); ctx.ellipse(-4, -54, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
  else if (z.type === 'football') {
    ctx.fillStyle = isFrozen ? '#406080' : (slowed ? '#3b5b7f' : '#2b4b6f'); 
    ctx.fillRect(-16 + walk * 0.6, -30, 14, 30);
    ctx.fillRect(2 - walk * 0.6, -30, 14, 30);
    ctx.fillStyle = isFrozen ? '#c0e0f0' : (slowed ? '#c0c0c0' : '#b0b0b0');
    ctx.beginPath(); ctx.ellipse(-9 + walk * 0.6, -15, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9 - walk * 0.6, -15, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.fillRect(-18 + walk * 0.6, -2, 16, 6);
    ctx.fillRect(2 - walk * 0.6, -2, 16, 6);
    ctx.fillStyle = isFrozen ? '#a0e0ff' : (slowed ? '#8fa9bf' : '#b71c1c');
    roundRect(-20, -72, 40, 46, 10); ctx.fill();
    ctx.fillStyle = isFrozen ? '#b0e8ff' : (slowed ? '#a0c0d8' : '#d32f2f');
    roundRect(-24, -70, 10, 22, 5); ctx.fill();
    roundRect(14, -70, 10, 22, 5); ctx.fill();
    ctx.fillStyle = isFrozen ? '#e0f8ff' : (slowed ? '#e0e8f0' : '#fff');
    ctx.fillRect(-2, -72, 4, 46);
    ctx.save();
    ctx.translate(-10, -60); ctx.rotate(-0.3 + Math.sin(t * 6) * 0.05);
    ctx.fillStyle = isFrozen ? '#a0e0ff' : (slowed ? '#8fa9bf' : '#b71c1c');
    ctx.fillRect(-35, 0, 35, 12);
    ctx.fillStyle = '#fff'; ctx.fillRect(-35, 2, 8, 8);
    ctx.restore();
    ctx.save();
    ctx.translate(10, -60); ctx.rotate(0.1 + Math.sin(t * 6 + 1) * 0.05);
    ctx.fillStyle = isFrozen ? '#a0e0ff' : (slowed ? '#8fa9bf' : '#b71c1c');
    ctx.fillRect(-10, 0, 35, 12);
    ctx.fillStyle = '#fff'; ctx.fillRect(17, 2, 8, 8);
    ctx.restore();
  } 
  else if (z.type === 'newspaper') {
    ctx.fillStyle = '#4a5a3a';
    ctx.fillRect(-16 + walk * 0.6, -30, 12, 30);
    ctx.fillRect(5 - walk * 0.6, -30, 12, 30);
    ctx.fillStyle = slowed ? '#6a6a7a' : '#5a5a6a';
    roundRect(-19, -72, 38, 46, 11); ctx.fill();
    ctx.fillStyle = '#e8e8e8';
    ctx.beginPath();
    ctx.moveTo(-6, -72); ctx.lineTo(0, -50); ctx.lineTo(6, -72);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-3, -70); ctx.lineTo(0, -55); ctx.lineTo(3, -70);
    ctx.closePath(); ctx.fill();
    
    ctx.strokeStyle = armC;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    if (z.armorHp > 0) {
      ctx.beginPath(); ctx.moveTo(-8, -65); ctx.lineTo(-20, -50); ctx.stroke();
      ctx.save();
      ctx.translate(-20, -50);
      ctx.rotate(-0.15);
      ctx.fillStyle = '#f0ece0';
      ctx.fillRect(-24, -30, 48, 56);
      ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-24, -30, 48, 56);
      ctx.fillStyle = '#222'; ctx.font = 'bold 11px serif'; ctx.textAlign = 'center';
      ctx.fillText('DAILY', 0, -14);
      ctx.fillStyle = '#777';
      for (let i = 0; i < 6; i++) ctx.fillRect(-18, -2 + i * 7, 36, 2);
      ctx.fillStyle = '#aaa'; ctx.fillRect(-18, -26, 14, 12);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.moveTo(-8, -65); ctx.lineTo(-32, -60);
      ctx.moveTo(8, -65); ctx.lineTo(-22, -55);
      ctx.stroke();
    }
  }
  else if (z.type === 'dancer' || z.type === 'backup') {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-16 + walk * 0.6, -30, 12, 30);
    ctx.fillRect(5 - walk * 0.6, -30, 12, 30);
    
    if (z.type === 'dancer') {
      ctx.fillStyle = slowed ? '#a05050' : '#d32f2f';
    } else {
      ctx.fillStyle = slowed ? '#3a3a4a' : '#1a1a2a';
    }
    roundRect(-19, -72, 38, 46, 11); ctx.fill();
    
    ctx.fillStyle = '#e8e8e8';
    ctx.beginPath();
    ctx.moveTo(-6, -72); ctx.lineTo(0, -50); ctx.lineTo(6, -72);
    ctx.closePath(); ctx.fill();
    
    ctx.fillStyle = z.type === 'dancer' ? '#1a1a1a' : '#d32f2f';
    ctx.beginPath();
    ctx.moveTo(-3, -70); ctx.lineTo(0, -55); ctx.lineTo(3, -70);
    ctx.closePath(); ctx.fill();
    
    ctx.strokeStyle = z.type === 'dancer' ? (slowed ? '#a05050' : '#d32f2f') : (slowed ? '#3a3a4a' : '#1a1a2a');
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    
    if (z.dancerState === 'summoning' || z.type === 'backup') {
      ctx.beginPath(); ctx.moveTo(-9, -65); ctx.lineTo(-30, -75); ctx.stroke();
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(-30, -75, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9, -65); ctx.lineTo(30, -75); ctx.stroke();
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(30, -75, 6, 0, Math.PI * 2); ctx.fill();
    } else {
      const swing = Math.sin(t * 8 + z.walkPhase) * 0.5;
      ctx.save();
      ctx.translate(-9, -65); ctx.rotate(-0.3 + swing);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-25, 10); ctx.stroke();
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(-25, 10, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(9, -65); ctx.rotate(0.3 - swing);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(25, 10); ctx.stroke();
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(25, 10, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  else {
    ctx.fillStyle = '#4a5a3a';
    ctx.fillRect(-16 + walk * 0.6, -30, 12, 30);
    ctx.fillRect(5 - walk * 0.6, -30, 12, 30);
    ctx.fillStyle = bodyC;
    roundRect(-19, -72, 38, 46, 11); ctx.fill();
    ctx.fillStyle = clothC;
    ctx.fillRect(-19, -54, 38, 10);
    ctx.fillStyle = armC;
    if (z.type === 'flag') {
      ctx.save();
      ctx.translate(9, -65); ctx.rotate(-0.2);
      ctx.fillRect(0, -35, 10, 40);
      ctx.restore();
    } else if (z.type === 'pole' && z.hasPole) {
      ctx.save();
      ctx.translate(12, -60);
      ctx.fillRect(0, 0, 26, 10);
      ctx.strokeStyle = '#d2b48c'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(26, 5); ctx.lineTo(46, 45); ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(-9, -65);
      ctx.rotate(-0.15 + Math.sin(t * 6) * 0.05);
      ctx.fillRect(-36, 0, 38, 10);
      ctx.restore();
    }
  }

  if (z.type !== 'gargantuar' && z.type !== 'imp') {
    const headY = -90 + chew;
    
    if (z.type === 'dancer') {
      ctx.fillStyle = '#1a1a1a';
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 16, headY + Math.sin(a) * 16, 12, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#f0f0f0';
      ctx.beginPath(); ctx.arc(0, headY, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b2b2b';
      ctx.beginPath(); ctx.arc(-8, headY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, headY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d32f2f';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, headY + 5, 7, 0.1, Math.PI - 0.1);
      ctx.stroke();
    } else {
      ctx.fillStyle = headC;
      ctx.beginPath(); ctx.arc(0, headY, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b2b2b';
      ctx.beginPath(); ctx.arc(-8, headY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, headY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a2a2a';
      ctx.beginPath();
      ctx.ellipse(-6, headY + 9, 8, z.eating ? 6 : 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (z.type === 'newspaper' && z.angry) {
      ctx.fillStyle = '#ff3030';
      ctx.beginPath(); ctx.arc(-8, headY - 3, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, headY - 3, 4, 0, Math.PI * 2); ctx.fill();
    }

    if (z.type === 'football' && z.armorHp > 0) {
      ctx.fillStyle = isFrozen ? '#a0e0ff' : (slowed ? '#8fa9bf' : '#b71c1c');
      ctx.beginPath(); ctx.arc(0, headY - 2, 24, Math.PI, 0); ctx.fill();
      ctx.fillRect(-24, headY - 2, 48, 14);
      ctx.fillStyle = isFrozen ? '#e0f8ff' : (slowed ? '#e0e8f0' : '#f5f0e6');
      ctx.fillRect(-5, headY - 26, 10, 28);
      ctx.strokeStyle = isFrozen ? '#6688a0' : (slowed ? '#668' : '#444');
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-16, headY + 8); ctx.lineTo(16, headY + 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, headY + 8); ctx.lineTo(-8, headY + 22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, headY + 8); ctx.lineTo(8, headY + 22); ctx.stroke();
    } else if (z.type === 'bucket' && z.armorHp > 0) {
      ctx.fillStyle = '#9ba3a8';
      ctx.beginPath();
      ctx.moveTo(-21, headY - 10); ctx.lineTo(-26, headY - 50);
      ctx.lineTo(26, headY - 50); ctx.lineTo(21, headY - 10);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, headY - 50, 14, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#c8d0d8';
      ctx.fillRect(-24, headY - 44, 48, 6);
    } else if (z.type === 'cone' && z.armorHp > 0) {
      // 路障帽（护甲还在时戴在头上）
      const ratio = Math.max(0, z.armorHp / z.maxArmorHp);
      const hatC = isFrozen ? '#8fe3ff' : (ratio > 0.5 ? '#e07b39' : '#b85c22');
      ctx.fillStyle = isFrozen ? '#c9f2ff' : '#8a4a1e';
      roundRect(-28, headY - 14, 56, 10, 4); ctx.fill();
      ctx.fillStyle = hatC;
      ctx.beginPath();
      ctx.moveTo(0, headY - 66);
      ctx.lineTo(-22, headY - 8);
      ctx.lineTo(22, headY - 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = isFrozen ? '#ffffff' : '#f5f0e6';
      ctx.beginPath();
      ctx.moveTo(-14, headY - 38);
      ctx.lineTo(14, headY - 38);
      ctx.lineTo(11, headY - 25);
      ctx.lineTo(-11, headY - 25);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = isFrozen ? '#5f8fa8' : '#7a3d14';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, headY - 66);
      ctx.lineTo(-22, headY - 8);
      ctx.lineTo(22, headY - 8);
      ctx.closePath(); ctx.stroke();
      if (ratio < 0.5) {
        ctx.strokeStyle = '#5a2a0c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-6, headY - 30); ctx.lineTo(2, headY - 20); ctx.lineTo(-3, headY - 14);
        ctx.stroke();
      }
    } else if (z.type === 'pole') {
      ctx.fillStyle = '#4b6a3a'; 
      ctx.beginPath(); ctx.arc(0, headY - 4, 20, Math.PI, 0); ctx.fill();
      ctx.fillRect(-20, headY - 4, 40, 6);
      ctx.fillStyle = '#324a26';
      ctx.beginPath(); ctx.ellipse(12, headY + 2, 14, 4, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-16, headY - 10); ctx.lineTo(16, headY - 10); ctx.stroke();
    }
  }

  if (z.type === 'screendoor' && z.armorHp > 0) {
    ctx.save();
    ctx.translate(-30, -50);
    const dmgRatio = z.armorHp / z.maxArmorHp;
    ctx.fillStyle = dmgRatio > 0.5 ? '#8a8a8a' : '#5a5a5a';
    ctx.fillRect(-8, -30, 16, 80);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) ctx.strokeRect(-8, -28 + i * 18, 16, 16);
    if (dmgRatio < 0.6) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-6, -20); ctx.lineTo(4, -10); ctx.lineTo(-4, 0);
      ctx.moveTo(6, 10); ctx.lineTo(-2, 20);
      ctx.stroke();
    }
    ctx.restore();
  }

  let barW = 40;
  let barY = -125;
  if (z.type === 'gargantuar') { barW = 80; barY = -140; }
  
  if (z.baseHp < z.maxBaseHp) {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(-barW/2, barY, barW, 6);
    let ratio = Math.max(0, z.baseHp / z.maxBaseHp);
    let color = z.friendly ? '#d070ff' : (ratio > 0.5 ? '#7ed957' : '#ff7043');
    ctx.fillStyle = color;
    ctx.fillRect(-barW/2, barY, barW * ratio, 6);
  }
  if (z.armorHp > 0 && z.maxArmorHp > 0) {
    const aY = barY + 9;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(-barW/2, aY, barW, 4);
    let ratio = Math.max(0, z.armorHp / z.maxArmorHp);
    let color = z.armorClass === 2 ? '#7ab8e8' : '#e8b84a';
    ctx.fillStyle = color;
    ctx.fillRect(-barW/2, aY, barW * ratio, 4);
  }

  if (isFrozen) {
    ctx.fillStyle = 'rgba(150, 220, 255, 0.28)';
    ctx.beginPath();
    ctx.arc(0, -40, (z.type==='gargantuar'?80:60), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  // 绘制环绕的路障护盾（恢复全局坐标后再画，位置才跟随僵尸本体）
  if (z.type === 'cone' && z.shields && z.shields.length > 0) {
    const centerX = z.x;
    const centerY = TOP + z.row * CH + CH / 2; // 与子弹判定使用同一个圆心
    for (let i = 0; i < z.shields.length; i++) {
      const angle = z.shieldAngle + i * (Math.PI * 2 / 3);
      const sx = centerX + Math.cos(angle) * (CW / 2);
      const sy = centerY + Math.sin(angle) * (CW / 2) - 20;

      ctx.save();
      ctx.translate(sx, sy);

      let cColor = '#e07b39';
      if (z.shields[i] <= 100) cColor = '#b85c22';
      if (z.shieldFrozen > 0) cColor = '#8fe3ff';

      // 画路障帽盾牌
      ctx.fillStyle = cColor;
      ctx.beginPath();
      ctx.moveTo(0, -58); ctx.lineTo(-22, -12); ctx.lineTo(22, -12);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = z.shieldFrozen > 0 ? '#fff' : '#f5f0e6';
      ctx.fillRect(-16, -32, 32, 7);

      ctx.strokeStyle = z.shieldFrozen > 0 ? '#6688a0' : '#b85c22';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -58); ctx.lineTo(-22, -12); ctx.lineTo(22, -12);
      ctx.closePath(); ctx.stroke();

      ctx.restore();
    }
  }
}

/* ================= 索敌 & 开火 ================= */
function hasZombieAhead(p, rangeCells = 99){
  const cx = GRASS_X + p.col * CW + CW / 2;
  return zombies.some(z => !z.friendly && z.hp > 0 && z.row === p.row
    && z.x > cx - 10 && z.x < cx + CW * rangeCells + 40);
}
function hasZombieNear(p, rangeCells){
  const c = cellCenter(p.col, p.row);
  return zombies.some(z => !z.friendly && z.hp > 0 && z.row === p.row
    && Math.abs(z.x - c.x) < CW * rangeCells);
}

function fire(p){
  const c = cellCenter(p.col, p.row);
  const baseX = c.x + 24;
  const baseY = c.y - 14;
  
  if (p.type === 'puffshroom'){
    bullets.push({ x: baseX - 10, y: baseY, startX: baseX - 10, row: p.row,
                   dmg: 20, speed: 300, maxRange: CW * 3.5, kind: 'spore' });
  } else if (p.type === 'fumeshroom'){
    bullets.push({ x: baseX, y: baseY, startX: baseX, row: p.row,
                   dmg: 20, speed: 340, maxRange: W, kind: 'fume',
                   pierce: true, pierceArmor: true, hitList: [] });
  } else if (p.type === 'scaredyshroom'){
    bullets.push({ x: baseX - 10, y: baseY, startX: baseX - 10, row: p.row,
                   dmg: 20, speed: 400, maxRange: CW * 22, kind: 'spore',
                   fromScaredy: true });
  }
  
  const col = p.type === 'fumeshroom' ? '#c8e6a0' : '#c9a8f0';
  addParticles(baseX, baseY, col, 6, { glow: true, sizeMul: 0.85 });
  playSound(p.type === 'fumeshroom' ? 'spore' : 'shoot');
}

/* ================= 墓碑绘制 ================= */
function drawGraves(){
  graves.forEach(g => {
    const c = cellCenter(g.col, g.row);
    const sh = g.shake > 0 ? (Math.random() - 0.5) * g.shake * 8 : 0;
    ctx.save();
    ctx.translate(c.x + sh, c.y + 16);
    ctx.fillStyle = '#241c26';
    ctx.beginPath(); ctx.ellipse(0, 12, 38, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(4, 12, 30, 10, 0, 0, Math.PI * 2); ctx.fill();
    const grad = ctx.createLinearGradient(-26, -50, 26, 12);
    grad.addColorStop(0, '#8b8b9c');
    grad.addColorStop(1, '#4a4a58');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-26, 12); ctx.lineTo(-26, -18);
    ctx.quadraticCurveTo(0, -60, 26, -18);
    ctx.lineTo(26, 12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2e2e38'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(40,40,52,.75)'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-12, -26); ctx.lineTo(-12, -2);
    ctx.moveTo(-18, -20); ctx.lineTo(-6, -20);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(30,30,40,.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, 6); ctx.lineTo(6, -2); ctx.lineTo(-2, -8);
    ctx.stroke();
    ctx.fillStyle = 'rgba(150,180,255,.10)';
    ctx.beginPath();
    ctx.moveTo(-26, -18); ctx.quadraticCurveTo(0, -60, 26, -18);
    ctx.lineTo(20, -14); ctx.quadraticCurveTo(0, -50, -20, -14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

/* ================= 统一伤害函数（含舞王共享） ================= */
function damageZombie(z, dmg, opts = {}){
  const { pierceArmor = false, isIce = false } = opts;
  
  // 舞王共享伤害
  let group = null;
  if (z.type === 'dancer') group = z;
  else if (z.type === 'backup' && z.ownerDancer) group = z.ownerDancer;
  
  if (group && group.hp > 0) {
    const members = [group, ...zombies.filter(o => o.type === 'backup' && o.ownerDancer === group && o.hp > 0)];
    let totalWeight = 4; // 舞王权重
    for (let i = 1; i < members.length; i++) totalWeight += 12; // 伴舞权重
    
    members.forEach((m, idx) => {
      const weight = idx === 0 ? 4 : 12;
      const share = dmg * (weight / totalWeight);
      m.baseHp -= share;
      if (m.baseHp <= 0) m.baseHp = 0;
      m.hp = m.baseHp;
    });
    
    if (isIce) {
      members.forEach(m => {
        m.freezeTimer = Math.max(m.freezeTimer, 4);
        m.slow = Math.max(m.slow, 10);
      });
    }
    return;
  }

  // 普通伤害
  if (z.armorHp > 0) {
    z.armorHp -= dmg;
    if (pierceArmor) {
      const ratio = z.armorClass === 2 ? 1.0 : 0.2;
      z.baseHp -= dmg * ratio;
    }
    if (z.armorHp <= 0) {
      z.armorHp = 0;
      if (z.type === 'newspaper' && !z.angry) { z.angry = true; z.speed *= 5; }
    }
  } else {
    z.baseHp -= dmg;
  }
  if (z.baseHp <= 0) {
    z.baseHp = 0;
    z.hp = 0;
  } else {
    z.hp = z.baseHp + Math.max(0, z.armorHp);
  }
  if (isIce) {
    z.freezeTimer = Math.max(z.freezeTimer, 4);
    z.slow = Math.max(z.slow, 10);
  }
}

/* ================= 更新 ================= */
/* ================= 更新 ================= */
function update(dt){
  for (const k in cardCD) if (cardCD[k] > 0) cardCD[k] = Math.max(0, cardCD[k] - dt);
  if (waveTextTimer > 0) waveTextTimer -= dt;
  
  graves.forEach(g => { if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 2); });
  for (let i = craters.length - 1; i >= 0; i--){
    craters[i].timer -= dt;
    if (craters[i].timer <= 0) craters.splice(i, 1);
  }

  if (spawnQueue.length > 0) {
    spawnCooldown -= dt;
    if (spawnCooldown <= 0) {
      const next = spawnQueue.pop();
      if (typeof next === 'object' && next.type === 'flag') spawnZombie(next.type, next.hp);
      else spawnZombie(next);
      
      const conf = getWaveConfig(wave);
      // 前 10 波沿用原版出怪节奏（开局不要一下子涌出来），之后逐波压缩
      let cd;
      if (wave <= 10) {
        cd = 3.5 - wave * 0.15 + Math.random() * 0.5;
      } else {
        cd = Math.max(0.20, 1.25 - (wave - 1) * 0.026) + Math.random() * 0.10;
      }
      if (conf.big) cd *= (wave <= 10 ? 0.7 : 0.72);
      spawnCooldown = cd;
    }
  } else {
    waveTimer += dt;
    
    if (wave === 0) {
      if (waveTimer >= 18) startWave(1);
    } 
    else if (wave < 50) {
      if (waveDelay > 0) {
        waveDelay -= dt;
        if (waveDelay <= 0) startWave(wave + 1);
      } else {
        const currentHp = zombies.reduce((sum, z) => sum + Math.max(0, z.hp), 0);
        const minTime = getWaveMinTime(wave);
        const maxTime = getWaveMaxTime(wave);

        // 血量压到本波一半以下：最短波长一到就进下一波；否则拖到最长波长
        const hpLow = currentHp <= lastWaveTotalHp * 0.5;

        if (waveTimer >= maxTime || (waveTimer >= minTime && hpLow)) {
          if (iceDelayPending) {
            iceDelayPending = false;
            waveDelay = 8;
          } else {
            startWave(wave + 1);
          }
        }
      }
    } 
    else if (wave === 50 && zombies.length === 0) {
      gameState = 'win';
      endTimer = 5;
    }
  }

  for (let i = suns.length - 1; i >= 0; i--){
    const s = suns[i];
    s.age += dt;
    if (s.y < s.targetY) s.y = Math.min(s.targetY, s.y + 100 * dt);
    else {
      s.rest += dt;
      if (s.rest > 14) suns.splice(i, 1);
    }
  }

  /* 植物更新 */
  for (let i = plants.length - 1; i >= 0; i--){
    const p = plants[i];
    p.t += dt;
    const isStunned = p.stunTimer && p.stunTimer > 0;
    if (isStunned) p.stunTimer -= dt;
    if (isStunned && p.type !== 'gravebuster') continue;

    if (p.type === 'gravebuster'){
      const targets = graves.filter(gr => Math.abs(gr.col - p.col) <= 1 && Math.abs(gr.row - p.row) <= 1);
      if (targets.length === 0) { plants.splice(i, 1); continue; }
      targets.forEach(gr => { gr.shake = 1; });
      p.graveTimer -= dt;
      const c = cellCenter(p.col, p.row);
      if (Math.random() < 0.3) addParticles(c.x + (Math.random()-0.5)*50, c.y + 20, '#8a8a98', 2, { sizeMul: 0.7 });
      if (p.graveTimer <= 0){
        targets.forEach(gr => {
          const idx = graves.indexOf(gr);
          if (idx >= 0) graves.splice(idx, 1);
          const gc = cellCenter(gr.col, gr.row);
          addParticles(gc.x, gc.y, '#8a8a98', 18);
          addParticles(gc.x, gc.y, '#b0b0bc', 8, { glow: true });
        });
        plants.splice(i, 1);
        playSound('hit');
      }
      continue;
    }

    if (p.type === 'sunshroom'){
      p.growTimer = (p.growTimer || 0) + dt;
      if (p.growTimer >= 80 && p.stage === 0){
        p.stage = 1; p.growTimer = 0;
        const c = cellCenter(p.col, p.row);
        addParticles(c.x, c.y, '#ffd633', 10, { glow: true });
        playSound('sun');
      } else if (p.growTimer >= 80 && p.stage === 1){
        p.stage = 2; p.growTimer = 0;
        const c = cellCenter(p.col, p.row);
        addParticles(c.x, c.y, '#ffd633', 16, { glow: true, sizeMul: 1.3 });
        playSound('sun');
      }
      if (p.t >= (p.nextSun || 16)){
        p.t = 0;
        p.nextSun = 16;
        const val = p.stage === 0 ? 10 : (p.stage === 1 ? 25 : 50);
        spawnSunAt(p, val);
      }
    }
    else if (p.type === 'puffshroom'){
      if (p.t >= 1.4 && hasZombieAhead(p, 3.5)){ p.t = 0; fire(p); }
    }
    else if (p.type === 'fumeshroom'){
      if (p.t >= 1.4 && hasZombieAhead(p, 99)){ p.t = 0; fire(p); }
    }
    else if (p.type === 'scaredyshroom'){
      p.hiding = hasZombieNear(p, 2.4);
      if (!p.hiding && p.t >= 0.65 && hasZombieAhead(p)){
        p.t = 0; fire(p);
      }
    }
    else if (p.type === 'gloamshroom'){
      if (p.t >= 0.93){
        p.t = 0;
        const leftEdge = GRASS_X + (p.col - 1) * CW;
        const rightEdge = GRASS_X + (p.col + 2) * CW;
        let hitAny = false;
        const hitPositions = [];
        zombies.forEach(z => {
          if (z.friendly || z.hp <= 0) return;
          if (Math.abs(z.row - p.row) > 1) return;
          if (z.x > leftEdge && z.x < rightEdge){
            damageZombie(z, 160, { pierceArmor: true });
            hitAny = true;
            hitPositions.push({x: z.x, y: TOP + z.row * CH + CH / 2 - 20});
            if (Math.random() < 0.2) z.x += CW * 0.3;
          }
        });
        if (hitAny){
          const c = cellCenter(p.col, p.row);
          for (let k = 0; k < 16; k++){
            const a = (k / 16) * Math.PI * 2 + gameTime * 2;
            addParticles(c.x + Math.cos(a) * 28, c.y + 6 + Math.sin(a) * 22,
              Math.random() < 0.5 ? '#c080ff' : '#e0b0ff', 3,
              { glow: true, sizeMul: 1.4, speedMul: 1.7 });
          }
          hitPositions.forEach(hp => {
            for (let k = 0; k < 5; k++) addParticles(hp.x, hp.y, '#d8a0ff', 2, { glow: true, sizeMul: 1.2, speedMul: 1.3 });
          });
          playSound('spore');
        }
      }
    }
    else if (p.type === 'iceshroom'){
      if (p.t >= 1.0){
        zombies.forEach(z => {
          if (z.friendly || z.hp <= 0) return;
          z.freezeTimer = 4;
          z.slow = 10;
        });
        iceDelayPending = true;
        const c = cellCenter(p.col, p.row);
        for (let k = 0; k < 90; k++){
          const a = Math.random() * Math.PI * 2;
          const r = Math.random() * CW * 5;
          particles.push({
            x: c.x + Math.cos(a) * r, y: c.y + 6 + Math.sin(a) * r * 0.5,
            vx: Math.cos(a) * (20 + Math.random() * 60), vy: -40 - Math.random() * 80,
            life: 0.8 + Math.random() * 0.8, max: 1.6,
            color: Math.random() < 0.5 ? '#d0f0ff' : (Math.random() < 0.5 ? '#ffffff' : '#8ad0ee'),
            r: 3 + Math.random() * 6, glow: true,
          });
        }
        playSound('ice');
        plants.splice(i, 1);
        continue;
      }
    }
    else if (p.type === 'doomershroom'){
      if (p.t >= 1.2){
        const c = cellCenter(p.col, p.row);
        zombies.forEach(z => {
          if (z.friendly || z.hp <= 0) return;
          // 毁灭菇属于穿透爆炸：护甲照常扣，同时对本体造成穿透伤害，避免有甲僵尸本体无伤
          damageZombie(z, 3600, { pierceArmor: true });
        });
        const cols = ['#ff7b7b','#ffd166','#ff9a3b','#e88cff','#6a4a7a','#3a2a48'];
        for (let k = 0; k < 150; k++){
          const a = Math.random() * Math.PI * 2;
          const r = Math.random() * W * 0.5;
          particles.push({
            x: c.x + Math.cos(a) * r, y: c.y + 6 + Math.sin(a) * r * 0.55,
            vx: Math.cos(a) * (60 + Math.random() * 260), vy: Math.sin(a) * (60 + Math.random() * 260) - 120,
            life: 0.7 + Math.random() * 0.9, max: 1.6,
            color: cols[Math.floor(Math.random() * cols.length)],
            r: 4 + Math.random() * 9, glow: true,
          });
        }
        screenShake = 0.6;
        playSound('boom');
        craters.push({ col: p.col, row: p.row, timer: 22 });
        plants.splice(i, 1);
        continue;
      }
    }
  }

  /* 僵尸更新 */
  for (let i = zombies.length - 1; i >= 0; i--){
    const z = zombies[i];
    if (z.hp <= 0){ zombies.splice(i, 1); if (!z.friendly) killed++; continue; }

    if (z.emergeTimer > 0){
      z.emergeTimer -= dt;
      const k = Math.max(0, z.emergeTimer / 1.2);
      z.emergeOffset = k * 80;
      if (z.emergeTimer <= 0) z.emergeOffset = 0;
      continue;
    }

    if (z.slow > 0) z.slow -= dt;
    if (z.freezeTimer > 0) z.freezeTimer -= dt;
    if (z.type === 'cone' && z.shields) {
      let frozen = false;
      if (z.shieldFrozen > 0) {
        z.shieldFrozen -= dt;
        frozen = true;
      }
      if (!frozen) {
        z.shieldAngle += dt * (Math.PI * 2 / 6); // 旋转速度
      }
      z.shields = z.shields.filter(hp => hp > 0);
    }

    if (z.friendly){
      z.eating = false;
      let tgt = null;
      for (const o of zombies){
        if (o === z || o.friendly || o.hp <= 0) continue;
        if (o.row !== z.row) continue;
        if (o.x > z.x && o.x - z.x < 70){ tgt = o; break; }
      }
      if (tgt){
        z.eating = true;
        damageZombie(tgt, 350 * dt);
        if (Math.random() < 0.08) playSound('hit');
        if (Math.random() < 0.15) addParticles(tgt.x, TOP + tgt.row*CH + CH/2 - 40, '#d070ff', 2, { glow: true });
      } else {
        // 被其他僵尸咬住时不再前进，否则会边挨打边逃走、永远打不死
        const bitten = zombies.some(o => o !== z && o.eatingFriendly === z);
        if (!bitten) z.x += Math.abs(z.speed) * dt;
      }
      if (z.x > W + 100) zombies.splice(i, 1);
      continue;
    }

    z.eatingFriendly = null;

    /* 舞王滑步与召唤 */
    if (z.type === 'dancer') {
      if (z.dancerState === 'entering' || z.dancerState === 'sliding') {
        z.dancerState = 'sliding';
        const checkCol = Math.floor((z.x - 30 - GRASS_X) / CW);
        let blocked = false;
        if (checkCol >= 0 && checkCol < COLS) {
          if (plants.some(p => p.col === checkCol && p.row === z.row)) blocked = true;
        }
        const targetX = W - 4 * CW;
        if (z.x > targetX && !blocked) {
          z.x -= (CW * 1.5) * dt;
          if (z.x <= targetX) z.x = targetX;
        } else {
          z.dancerState = 'summoning';
          z.summonTimer = 1.2;
        }
        continue;
      } else if (z.dancerState === 'summoning') {
        z.summonTimer -= dt;
        if (z.summonTimer <= 0) {
          const r = z.row;
          const positions = [
            { dr: 0, dx: -60, role: 'left' },
            { dr: 0, dx: 60, role: 'right' },
            { dr: -1, dx: 0, role: 'up' },
            { dr: 1, dx: 0, role: 'down' },
            { dr: -1, dx: -40, role: 'upleft' },
            { dr: -1, dx: 40, role: 'upright' },
            { dr: 1, dx: -40, role: 'downleft' },
            { dr: 1, dx: 40, role: 'downright' },
          ];
          const existing = zombies.filter(o => o.type === 'backup' && o.ownerDancer === z && o.hp > 0);
          
          for (const pos of positions) {
            const tr = r + pos.dr;
            if (tr < 0 || tr >= ROWS) continue;
            if (existing.some(o => o.role === pos.role)) continue;
            
            const b = makeBaseZombie('backup', tr, z.x + pos.dx);
            b.ownerDancer = z;
            b.role = pos.role;
            zombies.push(b);
          }
          
          addParticles(z.x, TOP + z.row * CH + CH / 2, '#d32f2f', 30, { glow: true });
          z.summoned = true;
          z.dancerState = 'walking';
        }
        continue;
      } else if (z.dancerState === 'walking') {
        const backups = zombies.filter(o => o.type === 'backup' && o.ownerDancer === z && o.hp > 0);
        if (backups.length < 8) {
          z.dancerState = 'summoning';
          z.summonTimer = 1.2;
          continue;
        }
      }
    }

    if (!z.isFlying && !z.jumping && z.freezeTimer <= 0){
      let friendlyNear = null;
      for (const o of zombies){
        if (!o.friendly || o.hp <= 0) continue;
        if (o.row !== z.row) continue;
        if (o.x > z.x - 45 && o.x < z.x + 70){ friendlyNear = o; break; }
      }
      if (friendlyNear){
        z.eating = true;
        z.eatingFriendly = friendlyNear;
        const dmgRate = z.type === 'gargantuar' ? 500 : (z.type === 'football' ? 300 : 100);
        // 走统一伤害函数：先扣护甲，护甲清空后再扣本体，血量归零才能正常死亡
        damageZombie(friendlyNear, dmgRate * dt);
        if (Math.random() < 0.08) playSound('eat');
        continue;
      }
    }

    // 铁桶重生（10秒）
    if (z.type === 'bucket') {
      if (z.armorHp <= 0) {
        z.regenTimer = (z.regenTimer || 0) + dt;
        if (z.regenTimer >= 10) {
          z.armorHp = z.maxArmorHp;
          z.hp = z.baseHp + z.armorHp;
          z.regenTimer = 0;
          addParticles(z.x, TOP + z.row * CH + CH / 2 - 50, '#9ba3a8', 20);
        }
      } else {
        z.regenTimer = 0;
      }
    }

    if (z.type === 'gargantuar' && wave >= 10) {
      if (!z.thrownImps) z.thrownImps = 0;
      const threshold = z.maxHp - (z.thrownImps + 1) * 1700;
      if (z.hp <= threshold && z.x > GRASS_X + 4 * CW && z.thrownImps < 4) {
        z.thrownImps++;
        for (let k = 0; k < 3; k++) {
          zombies.push({
            row: z.row, x: z.x - 20,
            flyStartX: z.x - 20, flyEndX: Math.max(GRASS_X - 10, z.x - 3 * CW - (k * 20)),
            hp: 500, maxHp: 500, baseHp: 500, maxBaseHp: 500, armorHp: 0, maxArmorHp: 0, armorClass: 0,
            speed: (CW / 4) * 2.5, type: 'imp',
            isFlying: true, flyTimer: 0, yOffset: 0, flyAngle: 0,
            slow: 0, freezeTimer: 0, eating: false,
            walkPhase: Math.random() * 10, friendly: false,
          });
        }
        addParticles(z.x, TOP + z.row * CH + CH / 2 - 60, '#a67c8c', 20);
      }
    }

    if (z.isFlying) {
      z.flyTimer += dt;
      const p = Math.min(1, z.flyTimer / 1.0); 
      z.x = z.flyStartX - (z.flyStartX - z.flyEndX) * p;
      z.flyAngle = p * Math.PI * 4;
      z.yOffset = -Math.sin(p * Math.PI) * 150; 
      if (p >= 1) {
        z.isFlying = false; z.yOffset = 0; z.flyAngle = 0;
        addParticles(z.x, TOP + z.row * CH + CH / 2, '#8fa67a', 15);
        const landCol = Math.floor((z.x - GRASS_X) / CW);
        if (landCol >= 0 && landCol < COLS) {
          const landPlant = plants.find(pl => pl.col === landCol && pl.row === z.row);
          if (landPlant) landPlant.stunTimer = 3;
        }
      }
    } else {
      if (z.jumping) {
        z.jumpTimer -= dt;
        if (z.jumpTimer <= 0) {
          z.jumping = false;
          z.x = z.jumpTargetX;
          addParticles(z.x, TOP + z.row * CH + CH / 2 + 30, '#d2b48c', 15);
        } else {
          const p = 1 - (z.jumpTimer / 2.0);
          z.x = z.jumpStartX + (z.jumpTargetX - z.jumpStartX) * p;
        }
        continue; 
      }

      let speed = z.speed;
      if (z.freezeTimer > 0) speed = 0;
      else if (z.slow > 0) speed *= 0.5;

      const col = Math.floor((z.x - 20 - GRASS_X) / CW);
      let target = null;
      if (col >= 0 && col < COLS){
        const candidates = plants.filter(pl => pl.col === col && pl.row === z.row);
        if (candidates.length > 0) target = candidates[candidates.length - 1];
      }

      if (target && speed > 0){
        if (z.type === 'pole' && z.hasPole) {
          z.jumping = true;
          z.jumpTimer = 2.0;
          z.jumpStartX = z.x;
          z.jumpTargetX = Math.max(GRASS_X - 10, GRASS_X + (target.col - 1) * CW + CW / 2);
          addParticles(z.x, TOP + z.row * CH + CH / 2 + 30, '#d2b48c', 20);
        } else {
          z.eating = true;
          
          if (z.type === 'gargantuar') {
            if (z.smashTimer === undefined) z.smashTimer = 0;
            z.smashTimer += dt;
            if (z.smashTimer >= 0.75) {
              z.smashTimer = 0;
              const idx = plants.indexOf(target);
              if (idx >= 0) {
                plants.splice(idx, 1); 
                addParticles(z.x - 30, TOP + z.row * CH + CH / 2, '#ffb347', 30);
                screenShake = 0.2; 
                playSound('smash');
              }
            }
          } else {
            if (target.type === 'hypnoshroom'){
              target.hp -= 100;
              z.friendly = true;
              z.baseHp = z.maxBaseHp * 1.5;
              z.maxBaseHp = z.maxBaseHp * 1.5;
              z.armorHp = z.maxArmorHp;
              z.hp = z.baseHp + z.armorHp;
              z.maxHp = z.maxBaseHp + z.maxArmorHp;
              z.speed *= 0.5;
              z.eating = false;
              z.scaleBoost = 1.2;
              const cc = cellCenter(target.col, target.row);
              addParticles(cc.x, cc.y, '#d070ff', 30, { glow: true, sizeMul: 1.3 });
              if (target.hp <= 0){
                const idx = plants.indexOf(target);
                if (idx >= 0) plants.splice(idx, 1);
              }
              playSound('ice');
            } else {
              if (!target.invincible) {
                const dmgRate = z.type === 'football' ? 300 : (z.type === 'newspaper' && z.armorHp <= 0 ? 1000 : 100);
                target.hp -= dmgRate * dt;
                if(Math.random() < 0.1) playSound('eat');
              }
              if (target.hp <= 0){
                const idx = plants.indexOf(target);
                if (idx >= 0) plants.splice(idx, 1);
              }
            }
          }
        }
      } else {
        z.eating = false;
        z.x -= speed * dt;
        if (z.type === 'gargantuar') z.smashTimer = 0;
      }

      if (z.x < GRASS_X - 40 && gameState === 'playing') {
        gameState = 'lose';
        endTimer = 5;
      }
    }
  }

  if (screenShake > 0) screenShake -= dt;

/* ================= 子弹 ================= */
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if (b.delay > 0) { b.delay -= dt; continue; }
    if (b.startX === undefined) b.startX = b.x;
    if (b.vx !== undefined) { b.x += b.vx * dt; b.y += b.vy * dt; }
    else b.x += b.speed * dt;

    // 被铁门反弹的子弹只打植物
    if (b.isReflected) {
      if (b.x < GRASS_X - 50) { bullets.splice(i, 1); continue; }
      let hitPlant = null;
      for (let j = 0; j < plants.length; j++) {
        const p = plants[j];
        const pc = cellCenter(p.col, p.row);
        if (p.row === b.row && b.x > pc.x - 34 && b.x < pc.x + 34) {
          hitPlant = p;
          break;
        }
      }
      if (hitPlant) {
        hitPlant.hp -= b.dmg;
        addParticles(b.x, b.y, '#ff6b6b', 8, { glow: true });
        if (hitPlant.hp <= 0) {
          const idx = plants.indexOf(hitPlant);
          if (idx >= 0) plants.splice(idx, 1);
        }
        bullets.splice(i, 1);
      }
      continue;
    }

    if (b.maxRange && b.x - b.startX > b.maxRange){ bullets.splice(i, 1); continue; }
    if (b.x > W + 40){ bullets.splice(i, 1); continue; }

    let hit = null;
    let hitShield = false;
    let shieldIndex = -1;

    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (z.hp <= 0 || z.friendly) continue;
      if (z.isFlying) continue;
      if (z.emergeTimer > 0) continue;
      if (z.type === 'pole' && z.jumping) continue;

      const isPierce = !!b.pierce;
      if (isPierce && b.hitList && b.hitList.includes(z)) continue;

      // 路障僵尸的三面环绕护盾优先挡子弹
      if (!isPierce && z.type === 'cone' && z.shields && z.shields.length > 0) {
        const centerX = z.x;
        const centerY = TOP + z.row * CH + CH / 2;
        for (let k = 0; k < z.shields.length; k++) {
          const angle = z.shieldAngle + k * (Math.PI * 2 / 3);
          const sx = centerX + Math.cos(angle) * (CW / 2);
          const sy = centerY + Math.sin(angle) * (CW / 2) - 20;
          if (Math.hypot(b.x - sx, b.y - (sy - 25)) < 35) {
            hit = z;
            hitShield = true;
            shieldIndex = k;
            break;
          }
        }
        if (hitShield) break;
      }

      // 本体判定
      if (z.row === b.row && b.x > z.x - 34 && b.x < z.x + 34) {
        hit = z;
        break;
      }
    }

    if (hit) {
      // 打中环绕护盾：扣护盾血，子弹消失
      if (hitShield) {
        hit.shields[shieldIndex] -= b.dmg;
        if (b.ice) hit.shieldFrozen = 2;
        if (hit.shields[shieldIndex] <= 0) {
          addParticles(hit.x, TOP + hit.row * CH + CH / 2 - 20, '#e07b39', 10);
        }
        bullets.splice(i, 1);
        continue;
      }

      // 铁门反弹
      if (hit.type === 'screendoor' && hit.armorHp > 0 && !b.pierce) {
        hit.armorHp -= b.dmg * 0.5;
        if (hit.armorHp <= 0) hit.armorHp = 0;
        hit.hp = hit.baseHp + hit.armorHp;
        b.isReflected = true;
        if (b.vx !== undefined) b.vx = -b.vx;
        b.speed = -b.speed;
        b.startX = b.x;
        addParticles(b.x, b.y, '#aaaaaa', 10);
        continue;
      }

      const wasAlive = hit.hp > 0;
      damageZombie(hit, b.dmg, { pierceArmor: !!b.pierceArmor, isIce: !!b.ice });

      if (b.fromScaredy && hit.hp <= 0 && wasAlive) {
        const col = Math.floor((hit.x - GRASS_X) / CW);
        if (col >= 0 && col < COLS) {
          const hasGrave = graves.some(g => g.col === col && g.row === hit.row);
          if (!hasGrave) {
            const sameCell = plants.filter(pl => pl.col === col && pl.row === hit.row && pl.type === 'puffshroom');
            if (sameCell.length < 3) {
              plants.push({ type: 'puffshroom', col, row: hit.row, hp: 300, maxHp: 300, t: 0, chew: 0 });
              const c = cellCenter(col, hit.row);
              addParticles(c.x, c.y, '#c9a8f0', 10, { glow: true });
            }
          }
        }
      }

      if (b.kind === 'fume') {
        b.hitList.push(hit);
        addParticles(b.x, b.y, '#c8e6a0', 8, { glow: true, sizeMul: 0.9 });
      } else {
        addParticles(b.x, b.y, b.kind === 'spore' ? '#c9a8f0' : '#d8ff9e', 8, { glow: true, sizeMul: 0.9 });
        bullets.splice(i, 1);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    p.vx *= 0.98;
  }
}

/* ================= 生成僵尸 ================= */
function makeBaseZombie(type, row, x, customHp){
  const isGarg = type === 'gargantuar';
  const isFootball = type === 'football';
  const isBucket = type === 'bucket';
  const isCone = type === 'cone';
  const isNewspaper = type === 'newspaper';
  const isScreenDoor = type === 'screendoor';
  
  let baseHp = 200, armorHp = 0, armorClass = 0;
  if (isCone) { baseHp = 200; armorHp = 600; armorClass = 1; }
  else if (isBucket) { baseHp = 200; armorHp = 1170; armorClass = 1; }
  else if (isFootball) { baseHp = 720; armorHp = 2500; armorClass = 1; }
  else if (isNewspaper) { baseHp = 720; armorHp = 720; armorClass = 2; }
  else if (isScreenDoor) { baseHp = 200; armorHp = 1100; armorClass = 2; }
  else if (isGarg) { baseHp = 7200; }
  else if (type === 'pole') { baseHp = 500; }
  else if (type === 'dancer') { baseHp = 720; }
  else if (type === 'backup') { baseHp = 500; }
  else if (type === 'imp') { baseHp = 500; }
  else if (type === 'flag') { baseHp = customHp || 200; }

  let speed = (CW / 4) + (Math.random() * 3 - 1.5);
  if (type === 'pole') speed = (CW / 2.5) * 1.5 + (Math.random() * 2 - 1);
  if (isFootball) speed = (CW / 4) * 2 + (Math.random() * 3 - 1.5);
  if (isGarg) speed = (CW / 8) + (Math.random() - 0.5);
  if (type === 'flag') speed *= 2;
  if (isNewspaper) speed *= 0.8;
  if (type === 'backup') speed *= 1.5;
  
  const z = {
    type, row, x,
    baseHp, maxBaseHp: baseHp,
    armorHp, maxArmorHp: armorHp, armorClass,
    hp: baseHp + armorHp, maxHp: baseHp + armorHp,
    speed,
    slow: 0, freezeTimer: 0,
    eating: false, walkPhase: Math.random() * 10,
    hasPole: type === 'pole', jumping: false,
    jumpTimer: 0, jumpStartX: 0, jumpTargetX: 0,
    thrownImps: 0, smashTimer: 0,
    isFlying: false, yOffset: 0, flyAngle: 0,
    emergeTimer: 0, emergeOffset: 0,
    friendly: false, angry: false,
    ownerDancer: null,
    role: null,
  };

  // 路障僵尸：三面环绕护盾（独立血量）
  if (isCone) {
    z.shields = [200, 200, 200]; 
    z.shieldAngle = Math.random() * Math.PI * 2;
    z.shieldFrozen = 0;
  }

  if (type === 'dancer') {
    z.dancerState = 'entering';
    z.summonTimer = 0;
    z.summoned = false;
  }
  
  return z;
}

function spawnZombieFromGrave(type, row, x){
  const z = makeBaseZombie(type, row, x);
  z.emergeTimer = 1.2;
  z.emergeOffset = 80;
  zombies.push(z);
  addParticles(x, TOP + row*CH + CH/2 + 20, '#3a2e30', 18, { sizeMul: 1.1 });
  addParticles(x, TOP + row*CH + CH/2, '#8a7a68', 8);
}

function spawnZombie(type, customHp){
  let count = 1;
  if (['normal', 'cone', 'bucket', 'screendoor'].includes(type)) {
    count = 3;
  }
  if (type === 'dancer') {
    count = 1;
  }

  for (let i = 0; i < count; i++) {
    let row = Math.floor(Math.random() * ROWS);
    if (type === 'dancer') {
      row = 1 + Math.floor(Math.random() * 3);
    }
    const spawnX = W + 50 + Math.random() * 80 + (i * 30);
    const z = makeBaseZombie(type, row, spawnX, customHp);
    zombies.push(z);
  }
}

  ctx.fillStyle = dg;
  ctx.fillRect(0, TOP, GRASS_X, H - TOP - BOTTOM_BAR);
