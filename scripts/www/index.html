  for (let y = TOP; y < H - BOTTOM_BAR; y += 30) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GRASS_X, y); ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++){
    ctx.fillStyle = r % 2 === 0 ? '#2e5c46' : '#27503c';
    ctx.fillRect(GRASS_X, TOP + r * CH, GRASS_W, CH);
  }
  ctx.fillStyle = '#15151b';
  ctx.fillRect(GRASS_X + GRASS_W, TOP, W - (GRASS_X + GRASS_W), H - TOP - BOTTOM_BAR);
  ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 4;
  ctx.setLineDash([20, 15]);
  for (let r = 0; r < ROWS; r++) {
    const cy = TOP + r * CH + CH / 2;
    ctx.beginPath(); ctx.moveTo(GRASS_X + GRASS_W + 10, cy); ctx.lineTo(W, cy); ctx.stroke();
  }
  ctx.setLineDash([]);

  const mg = ctx.createLinearGradient(0, TOP, 0, H - BOTTOM_BAR);
  mg.addColorStop(0, 'rgba(70,110,200,0.18)');
  mg.addColorStop(0.55, 'rgba(40,70,140,0.08)');
  mg.addColorStop(1, 'rgba(10,20,50,0.18)');

  ctx.fillRect(0, TOP, W, H - TOP - BOTTOM_BAR);

  tg.addColorStop(0, 'rgba(0,0,0,.45)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, TOP, W, 120);

  for (let i = 0; i < 22; i++){
    const seed = i * 137.5;
    const fx = GRASS_X + 40 + ((Math.sin(seed) * 0.5 + 0.5) * (GRASS_W - 80)) + Math.sin(gameTime * 0.35 + seed) * 40;
    const fy = TOP + 60 + ((Math.cos(seed * 1.7) * 0.5 + 0.5) * (H - TOP - BOTTOM_BAR - 120)) + Math.cos(gameTime * 0.5 + seed * 2) * 30;
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(gameTime * 2.2 + seed));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = '#d9ff8a'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#eaffa0';
    ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  craters.forEach(cr => {
    const c = cellCenter(cr.col, cr.row);

    ctx.beginPath(); ctx.ellipse(c.x, c.y + 22, CW * 0.44, CH * 0.36, 0, 0, Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.ellipse(c.x, c.y + 22, CW * 0.44, CH * 0.36, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });
}

function drawProgressBar() {
  const barY = H - 26;
  const barX = GRASS_X + 40;
  const barW = GRASS_W - 80;
  ctx.fillStyle = '#150f1c';
  ctx.fillRect(0, H - BOTTOM_BAR, W, BOTTOM_BAR);
  ctx.fillStyle = '#0c0812'; 
  roundRect(barX, barY - 16, barW, 32, 16); ctx.fill();
  ctx.strokeStyle = '#3a2c48'; ctx.lineWidth = 3;
  roundRect(barX + 3, barY - 13, barW - 6, 26, 13); ctx.stroke();
  
  let progress = 0;
  if (wave > 0) {
    if (spawnQueue.length > 0) {
      const conf = getWaveConfig(wave);
      const spawnedInWave = conf.count - spawnQueue.length;
      progress = (wave - 1 + spawnedInWave / conf.count) / 50; 
    } else {
      const maxTime = (wave === 10 || wave === 20 || wave === 30 || wave === 40 || wave === 48) ? 35 : 28;
      progress = (wave - 1 + Math.min(1, waveTimer / maxTime)) / 50;
    }
  }
  progress = Math.max(0, Math.min(1, progress));
  if (progress > 0.01) {
    ctx.fillStyle = '#3f7a4e';
    roundRect(barX + 3, barY - 13, (barW - 6) * progress, 26, 13); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.13)'; 
    roundRect(barX + 6, barY - 10, (barW - 12) * progress, 10, 5); ctx.fill();
  }
  const flags = [10, 20, 30, 40, 48, 50];
  flags.forEach(f => {
    const fx = barX + barW * (f / 50);
    ctx.strokeStyle = '#6b5a4e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(fx, barY - 13); ctx.lineTo(fx, barY - 50); ctx.stroke();
    ctx.fillStyle = f === 50 ? '#d32f2f' : '#444';
    ctx.beginPath();
    ctx.moveTo(fx + 3, barY - 48); ctx.lineTo(fx + 28, barY - 42); ctx.lineTo(fx + 3, barY - 32);
    ctx.closePath(); ctx.fill();
    if (f === 50) { 
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(fx + 10, barY - 42, 4, 0, Math.PI * 2); ctx.fill();
    }
  });
  drawProgressZombieHead(barX + barW * progress, barY);
}

/* ================= 放置判定 ================= */
function canPlaceAt(col, row, type){
  if (craters.some(c => c.col === col && c.row === row)) return false;
  const grave = graves.find(g => g.col === col && g.row === row);
  const candidates = plants.filter(p => p.col === col && p.row === row);
  
  if (type === 'gloamshroom') return false;
  if (type === 'gravebuster') return !!grave && candidates.length === 0;
  if (type === 'puffshroom'){
    if (grave) return false;
    const puffs = candidates.filter(p => p.type === 'puffshroom');
    if (puffs.length >= 3) return false;
    if (candidates.length > puffs.length) return false;
    return true;
  }
  if (grave) return false;
  if (candidates.length > 0) return false;
  return true;
}

function drawHover(){
  if (!selected || gameState !== 'playing') return;
  if (mouse.y < TOP || mouse.y > H - BOTTOM_BAR || mouse.x < GRASS_X) return;
  const col = Math.floor((mouse.x - GRASS_X) / CW);
  const row = Math.floor((mouse.y - TOP) / CH);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  const px = GRASS_X + col * CW;
  const py = TOP + row * CH;
  const candidates = plants.filter(p => p.col === col && p.row === row);
  
  if (selected === 'shovel'){
    const ok = candidates.length > 0;
    ctx.fillStyle = ok ? 'rgba(255,80,80,.32)' : 'rgba(255,255,255,.12)';
    ctx.fillRect(px, py, CW, CH);
    ctx.strokeStyle = ok ? '#ff6b6b' : '#ffffff'; ctx.lineWidth = 3;
    ctx.strokeRect(px + 1.5, py + 1.5, CW - 3, CH - 3);
  } else if (selected === 'gloamshroom'){
    const canUpgrade = candidates.length === 1 && candidates[0].type === 'fumeshroom';
    ctx.fillStyle = canUpgrade ? 'rgba(180,130,230,.35)' : 'rgba(255,80,80,.30)';
    ctx.fillRect(px, py, CW, CH);
    ctx.strokeStyle = canUpgrade ? '#d8b4e2' : '#ff6b6b'; ctx.lineWidth = 3;
    ctx.strokeRect(px + 1.5, py + 1.5, CW - 3, CH - 3);
  } else {
    const ok = canPlaceAt(col, row, selected);
    ctx.fillStyle = ok ? 'rgba(150,255,160,.20)' : 'rgba(255,80,80,.30)';
    ctx.fillRect(px, py, CW, CH);
    ctx.strokeStyle = ok ? '#9effa0' : '#ff6b6b'; ctx.lineWidth = 3;
    ctx.strokeRect(px + 1.5, py + 1.5, CW - 3, CH - 3);
  }
}

function drawPreview(){
  if (!selected || selected === 'shovel' || gameState !== 'playing') return;
  if (mouse.y < TOP || mouse.y > H - BOTTOM_BAR || mouse.x < GRASS_X) return;
  const col = Math.floor((mouse.x - GRASS_X) / CW);
  const row = Math.floor((mouse.y - TOP) / CH);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  const c = cellCenter(col, row);
  const candidates = plants.filter(p => p.col === col && p.row === row);

  if (selected === 'gloamshroom'){
    if (candidates.length === 1 && candidates[0].type === 'fumeshroom') {
      ctx.globalAlpha = 0.6;
      drawPlantShape('gloamshroom', c.x, c.y + 10, 1.3);
      ctx.globalAlpha = 1;
    }
    return;
  }
  if (!canPlaceAt(col, row, selected)) return;
  ctx.globalAlpha = 0.6;
  if (selected === 'puffshroom'){
    const puffs = candidates.filter(p => p.type === 'puffshroom');
    const idx = puffs.length;
    const total = idx + 1;
    const offX = (idx - (total - 1) / 2) * 18;
    const offY = idx * -8;
    drawPlantShape(selected, c.x + offX, c.y + 10 + offY, 1.3);
  } else {
    drawPlantShape(selected, c.x, c.y + 10, 1.3);
  }
  ctx.globalAlpha = 1;
}

    ctx.fillStyle = '#8a8098';
    ctx.font = '26px "Microsoft YaHei", sans-serif';
    ctx.fillText('还没有战绩，先打一局吧', x + w / 2, y + 250);
  } else {
    list.forEach((r, i) => {
      const ry = y + 160 + i * 36;
      if (i % 2 === 0){
        ctx.fillStyle = 'rgba(255,255,255,.045)';
        roundRect(x + 34, ry - 16, w - 68, 32, 8); ctx.fill();
      }
      ctx.font = 'bold 23px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = r.result === 'win' ? '#8ce87a' : '#ff8080';
      ctx.fillText(r.result === 'win' ? '胜利' : '失败', cols[0], ry);
      ctx.font = '22px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#e8e0f0';
      ctx.fillText('第 ' + r.wave + ' 波', cols[1], ry);
      ctx.fillText(String(r.kills), cols[2], ry);
      ctx.fillText(fmtDuration(r.time), cols[3], ry);
      ctx.fillStyle = '#9a90a8';
      ctx.fillText(fmtRecordDate(r.date), cols[4], ry);
    });
  }

  const best = getHistoryBest();
  ctx.fillStyle = '#ffd633';
  ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
  const bestText = best.bestTime !== null
    ? `最佳：最快通关 ${fmtDuration(best.bestTime)} · 最多击杀 ${best.bestKills} · 最高第 ${best.bestWave} 波`
    : `最佳：暂无通关记录 · 最多击杀 ${best.bestKills} · 最高第 ${best.bestWave} 波`;
  ctx.fillText(bestText, x + w / 2, y + h - 74);

  ctx.fillStyle = '#8a8098';
  ctx.font = '21px "Microsoft YaHei", sans-serif';
  ctx.fillText('点击任意位置关闭', x + w / 2, y + h - 34);
  ctx.restore();
}


function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (screenShake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  drawLawn();
  drawGraves();
  drawHover();
  plants.slice().sort((a, b) => a.row - b.row).forEach(drawPlant);

  bullets.forEach(b => {
    if (b.delay > 0) return; 
    ctx.save();
    if (b.isReflected) {
      ctx.shadowColor = '#ff9999'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff7777';
      ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffcccc';
      ctx.beginPath(); ctx.arc(b.x + 2, b.y - 2, 5, 0, Math.PI * 2); ctx.fill();
    } else if (b.kind === 'fume'){
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#b8d68a';
      ctx.beginPath(); ctx.arc(b.x, b.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d8f0b0';
      ctx.beginPath(); ctx.arc(b.x - 6, b.y - 4, 10, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (b.kind === 'spore'){
      ctx.shadowColor = '#b088e0'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#c9a8f0';
      ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8d8ff';
      ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.shadowColor = '#c6ff7a'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#9ee34a';
      ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  });

  drawTopBar(); 
  zombies.slice().sort((a, b) => a.row - b.row).forEach(drawZombie);
  suns.forEach(drawSun);

  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if (p.glow) { ctx.shadowColor = p.color; ctx.shadowBlur = 18; }
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    if (p.glow) ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });

  drawPreview();
  drawProgressBar();
  drawOverlay();
  ctx.restore();

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.92);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // UI 按钮和面板放在暗角之后，避免被压暗
  drawRecordButton();
  if (showHistory) drawHistoryPanel();
}

/* ================= 输入 ================= */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height),
  };
}

cv.addEventListener('mousemove', e => {
  const p = canvasPos(e);
  mouse.x = p.x; mouse.y = p.y;
});
cv.addEventListener('mouseleave', () => { mouse.x = -1; mouse.y = -1; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); selected = null; });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') showHistory = false;
  else if (e.key === 'h' || e.key === 'H') showHistory = !showHistory;
});

cv.addEventListener('pointerdown', e => {
  if (e.isPrimary === false) return;
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  initAudio(); 
  const {x: mx, y: my} = canvasPos(e);
  if (showHistory){ showHistory = false; return; }
  if (inRecordButton(mx, my)){ selected = null; showHistory = true; return; }
  if (gameState !== 'playing' && endTimer > 0) return; 
  if (gameState !== 'playing'){ reset(); return; }

  for (let i = suns.length - 1; i >= 0; i--){
    const s = suns[i];
    if (Math.hypot(mx - s.x, my - s.y) < 45){
      sun += (s.value || 25);
      addParticles(s.x, s.y, '#ffd633', 12, { glow: true });
      suns.splice(i, 1);
      playSound('sun');
      return;
    }
  }

  if (mx >= SHOVEL_X && mx <= SHOVEL_X + SHOVEL_W && my >= SHOVEL_Y && my <= SHOVEL_Y + SHOVEL_H) {
    selected = (selected === 'shovel') ? null : 'shovel';
    return;
  }

  if (my < CARD_Y + CARD_H && mx >= CARD_X0){
    const i = Math.floor((mx - CARD_X0) / CARD_W);
    if (i >= 0 && i < PLANT_ORDER.length){
      const key = PLANT_ORDER[i];
      const def = PLANT_DEFS[key];
      if (selected === key) selected = null;
      else if (cardCD[key] <= 0 && sun >= def.cost) selected = key;
      return;
    }
  }

  if (selected && my >= TOP && my <= H - BOTTOM_BAR && mx >= GRASS_X){
    const col = Math.floor((mx - GRASS_X) / CW);
    const row = Math.floor((my - TOP) / CH);
    
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      const candidates = plants.filter(p => p.col === col && p.row === row);
      const def = PLANT_DEFS[selected];
      
      if (selected === 'gloamshroom') {
        if (candidates.length === 1 && candidates[0].type === 'fumeshroom') {
          if (sun >= def.cost && cardCD[selected] <= 0) {
            sun -= def.cost;
            cardCD[selected] = def.cd;
            const tp = candidates[0];
            tp.type = 'gloamshroom';
            tp.hp = def.hp; tp.maxHp = def.hp;
            tp.t = 0;
            const c = cellCenter(col, row);
            addParticles(c.x, c.y, '#b080e0', 25, { glow: true, sizeMul: 1.3 });
            addParticles(c.x, c.y, '#e0b0ff', 15, { glow: true });
            playSound('plant');
          }
        }
        selected = null;
        return;
      }
      
      if (selected === 'shovel') {
        if (candidates.length > 0) {
          const target = candidates[candidates.length - 1];
          const c = cellCenter(col, row);
          addParticles(c.x, c.y, '#6a5a7a', 20);
          plants.splice(plants.indexOf(target), 1);
          playSound('shoot');
        }
        selected = null;
        return;
      }
      
      if (canPlaceAt(col, row, selected) && sun >= def.cost && cardCD[selected] <= 0){
        sun -= def.cost;
        cardCD[selected] = def.cd;
        const newPlant = {
          type: selected, col, row,
          hp: def.hp, maxHp: def.hp, t: 0, chew: 0,
        };
        if (selected === 'sunshroom') {
          newPlant.nextSun = 16;
          newPlant.growTimer = 0;
          newPlant.stage = 0;
        }
        if (selected === 'gravebuster') newPlant.graveTimer = 4;
        plants.push(newPlant);
        const c = cellCenter(col, row);
        addParticles(c.x, c.y + 25, '#a8b8a0', 10);
        playSound('plant');
      }
    }
    selected = null;
    return;
  }
  selected = null;
});

/* ================= 手机版：全屏 & 手势 ================= */
const fsBtn = document.getElementById('fsBtn');
if (fsBtn){
  fsBtn.addEventListener('click', async e => {
    e.stopPropagation();
    try {
      if (!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      } else {
        await document.exitFullscreen();
      }
    } catch (err) {}
  });
}
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

/* ================= 主循环 ================= */
let lastT = performance.now();
function loop(now){
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  // 查看战绩时暂停游戏与计时
  if (showHistory || mobilePaused){
    draw();
    requestAnimationFrame(loop);
    return;
  }

  gameTime += dt;
  
  // 修复：区分 playing 与其他状态，确保倒计时正常
  if (gameState === 'playing') {
    update(dt);
  } else if (endTimer > 0) {
    endTimer -= dt;
  }

  if (gameState !== 'playing' && !runSaved){
    saveRunRecord(gameState === 'win' ? 'win' : 'lose');
  }

  draw();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
